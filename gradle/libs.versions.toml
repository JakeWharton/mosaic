[versions]
jetbrains-compose = "1.8.2"
kotlin = "2.2.0"
kotlinx-coroutines = "1.10.2"

[libraries]
kotlin-plugin-core = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-plugin-compose = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

kotlinx-io-core = "org.jetbrains.kotlinx:kotlinx-io-core:0.8.0"

androidx-annotation = "androidx.annotation:annotation:1.9.1"
androidx-collection = { module = "org.jetbrains.compose.collection-internal:collection", version.ref = "jetbrains-compose" }
androidx-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "jetbrains-compose" }
androidx-lifecycle-compose = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose:2.9.1"

maven-publish-gradlePlugin = "com.vanniktech:gradle-maven-publish-plugin:0.34.0"
dokka-gradlePlugin = "org.jetbrains.dokka:dokka-gradle-plugin:2.0.0"
cite-gradlePlugin = "com.jakewharton.cite:cite-gradle-plugin:0.6.1"
poko-gradlePlugin = "dev.drewhamilton.poko:poko-gradle-plugin:0.19.1"
binary-compatibility-validator-gradlePlugin = "org.jetbrains.kotlinx:binary-compatibility-validator:0.18.1"
cklib-gradlePlugin = "co.touchlab:cklib-gradle-plugin:0.3.4"
jextract-gradlePlugin = "de.infolektuell:gradle-plugin-jextract:0.5.0"

spotless-gradlePlugin = "com.diffplug.spotless:spotless-plugin-gradle:7.1.0"
ktlint-core = "com.pinterest.ktlint:ktlint-cli:1.3.1"
ktlint-composeRules = "io.nlopez.compose.rules:ktlint:0.4.24"

clikt = "com.github.ajalt.clikt:clikt:5.0.3"
codepoints = "de.cketti.unicode:kotlin-codepoints:0.10.0"
finalizationHook = "com.jakewharton.finalization:finalization-hook:0.1.0"
apache-compress = "org.apache.commons:commons-compress:1.27.1"

junit4 = "junit:junit:4.13.2"
assertk = "com.willowtreeapps.assertk:assertk:0.28.1"
